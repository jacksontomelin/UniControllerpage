<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Acompanhar atendimento | UNICONTROLLER</title>
<meta name="description" content="Acompanhe o andamento da sua solicitação na UniController.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="theme-color" content="#050B33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#050B33;--az:#0061AF;--az2:#0084C7;--azl:#E8F4FD;--cy:#7DD3F5;
--txt:#0D1B3E;--muted:#5A6A8A;--bg:#F7F9FD;--border:#DDE6F5;--green:#10B981;--red:#E85D5D}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--az2);text-decoration:none}
.logo{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.5px}
.logo .u,.logo .p{color:var(--az2)}
nav{background:var(--navy);padding:calc(18px + env(safe-area-inset-top)) 24px 18px}
.nav-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
nav .logo{font-size:18px;color:#fff}
nav .logo .u,nav .logo .p{color:var(--cy)}
nav a.back{font-size:13px;color:rgba(255,255,255,.62)}
nav a.back:hover{color:#fff}
main{flex:1;max-width:720px;margin:0 auto;width:100%;padding:44px 24px 70px}
h1{font-family:'Syne',sans-serif;font-size:31px;font-weight:800;letter-spacing:-1px;margin-bottom:10px}
.sub{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:30px}
.busca{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.busca input{flex:1;min-width:210px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--txt);background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-transform:uppercase}
.busca input:focus{outline:none;border-color:var(--az2)}
.busca button{padding:14px 26px;background:linear-gradient(135deg,var(--az),var(--az2));border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#fff;cursor:pointer;transition:transform .22s,box-shadow .25s;box-shadow:0 8px 24px rgba(0,97,175,.35)}
.busca button:hover{transform:translateY(-2px)}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:18px}
.hero-t{background:linear-gradient(135deg,var(--navy),#0D2060);border-radius:20px;padding:30px 32px;color:#fff;margin-bottom:18px}
.hero-t .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--cy);margin-bottom:8px}
.hero-t .cd{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.8px}
.hero-t .meta{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;color:rgba(255,255,255,.62);line-height:1.8}
.hero-t .meta b{color:#fff}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(125,211,245,.16);border:1px solid rgba(125,211,245,.3);padding:6px 13px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--cy);margin-top:14px}
.badge .d{width:6px;height:6px;border-radius:50%;background:var(--cy)}
h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--navy);margin-bottom:20px;letter-spacing:-.3px}
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.ev{position:relative;padding-bottom:24px}
.ev:last-child{padding-bottom:0}
.ev::before{content:'';position:absolute;left:-30px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--border)}
.ev.on::before{background:var(--az2);border-color:var(--az2);box-shadow:0 0 0 4px rgba(0,132,199,.14)}
.ev b{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--navy);display:block;letter-spacing:-.2px}
.ev .dt{font-size:12px;color:var(--muted);margin-top:3px}
.ev p{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:7px}
.aviso{border-radius:14px;padding:18px 20px;font-size:14px;line-height:1.7}
.aviso.erro{background:#FDECEC;border-left:3px solid var(--red);color:#8C2F2F}
.aviso.info{background:var(--azl);border-left:3px solid var(--az2);color:var(--txt)}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:22px;border-top:1px solid var(--border)}
.btn-wa{display:inline-flex;align-items:center;gap:9px;background:#25D366;color:#fff;padding:13px 22px;border-radius:11px;font-family:'Syne',sans-serif;font-size:13.5px;font-weight:800;transition:transform .22s}
.btn-wa:hover{transform:translateY(-2px)}
.btn-wa svg{width:16px;height:16px;fill:#fff}
.btn-gh{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--border);color:var(--navy);padding:13px 22px;border-radius:11px;font-family:'Syne',sans-serif;font-size:13.5px;font-weight:800}
.btn-gh:hover{border-color:var(--az2)}
.hide{display:none}
footer{background:var(--navy);color:rgba(255,255,255,.5);padding:34px 24px;text-align:center;font-size:12.5px;line-height:1.9}
footer a{color:var(--cy)}
@media(max-width:600px){
  nav{padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  main{padding:32px 16px 52px}
  h1{font-size:25px}
  .card,.hero-t{padding:24px 20px;border-radius:16px}
  .hero-t .cd{font-size:25px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a href="/" class="logo"><span class="u">UNI</span>CONTROLLER<span class="p">.</span></a>
    <a href="/" class="back">Voltar ao site</a>
  </div>
</nav>

<main>
  <h1>Acompanhar atendimento</h1>
  <p class="sub">Informe o número do ticket que enviamos para o seu e-mail.</p>

  <form class="busca" id="fb">
    <input id="cod" type="text" placeholder="UC-2026-0001" autocomplete="off" spellcheck="false" aria-label="Número do ticket">
    <button type="submit">Consultar</button>
  </form>

  <div id="saida"></div>
</main>

<footer>
  <a href="mailto:suporte@unicontroller.com.br">suporte@unicontroller.com.br</a> &middot;
  <a href="https://wa.me/5547999357131">(47) 99935-7131</a><br>
  © <span id="ano">2026</span> UniController. Blumenau e Timbó, Santa Catarina.
</footer>

<script>
(function(){
  document.getElementById('ano').textContent = new Date().getFullYear();

  var API = window.UC_API || 'https://api.unicontroller.com.br';
  var saida = document.getElementById('saida');
  var campo = document.getElementById('cod');

  var fmt = function(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }catch(e){ return iso; }
  };
  var esc = function(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  };

  function aviso(tipo, txt){
    saida.innerHTML = '<div class="aviso ' + tipo + '">' + esc(txt) + '</div>';
  }

  function render(d){
    var evs = d.historico.map(function(e, i){
      var ultimo = i === d.historico.length - 1;
      return '<div class="ev' + (ultimo ? ' on' : '') + '">' +
        '<b>' + esc(e.rotulo) + '</b>' +
        '<div class="dt">' + esc(fmt(e.criado_em)) + '</div>' +
        (e.nota ? '<p>' + esc(e.nota) + '</p>' : '') +
      '</div>';
    }).join('');

    saida.innerHTML =
      '<div class="hero-t">' +
        '<div class="lb">Número do ticket</div>' +
        '<div class="cd">' + esc(d.codigo) + '</div>' +
        '<div class="badge"><span class="d"></span>' + esc(d.rotulo) + '</div>' +
        '<div class="meta">' +
          'Empresa: <b>' + esc(d.empresa) + '</b><br>' +
          'E-mail de contato: <b>' + esc(d.email) + '</b><br>' +
          'Aberto em: <b>' + esc(fmt(d.criado_em)) + '</b>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Andamento</h2>' +
        '<div class="tl">' + evs + '</div>' +
        '<div class="acoes">' +
          '<a class="btn-wa" target="_blank" rel="noopener" href="https://wa.me/5547999357131?text=' +
            encodeURIComponent('Olá! Sobre o meu atendimento ' + d.codigo + '.') + '">' +
            '<svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2z"/></svg>' +
            'Falar no WhatsApp</a>' +
          '<a class="btn-gh" href="mailto:suporte@unicontroller.com.br?subject=' +
            encodeURIComponent(d.codigo + ' | UniController') + '">Responder por e-mail</a>' +
        '</div>' +
      '</div>';
  }

  function buscar(codigo){
    if(!codigo){ aviso('erro','Informe o número do ticket.'); return; }
    aviso('info','Consultando…');
    fetch(API + '/api/tickets/' + encodeURIComponent(codigo))
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(!res.ok || !res.j.ok){
          aviso('erro', res.j.erro || 'Ticket não encontrado. Confira o número que enviamos por e-mail.');
          return;
        }
        render(res.j);
      })
      .catch(function(){
        aviso('erro','Não foi possível consultar agora. Tente de novo em instantes ou fale no WhatsApp (47) 99935-7131.');
      });
  }

  document.getElementById('fb').addEventListener('submit', function(ev){
    ev.preventDefault();
    buscar(campo.value.trim().toUpperCase());
  });

  var p = new URLSearchParams(location.search).get('c');
  if(p){ campo.value = p.toUpperCase(); buscar(campo.value); }
})();
</script>

</body>
</html>
